<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenChat</title>
    <meta name="description" content="OpenChat: private, end-to-end encrypted messages, photos, voice notes and calls with people across India." />
    <meta name="theme-color" content="#2563EB" />
    <script>
      // Apply the theme before the first paint, so a dark-mode user never sees
      // a white flash. Saved choice first, otherwise the OS setting.
      // Keep the storage key in sync with src/components/ThemeToggle.jsx.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("openchat-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
